[project]
name = "carhunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ChrisPos", email = "chrispos.chp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "httpx[http2]>=0.28.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.0",
    "tenacity>=9.2.1",
]

[project.scripts]
carhunter = "carhunter:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
